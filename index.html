<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>La nostra spesa</title>

    <!-- PWA & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f6f4a" id="theme-color-meta">
    <meta name="description" content="Lista della spesa familiare condivisa in tempo reale">

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="La nostra spesa">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <!-- Font moderni -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <main class="container">
        <!-- App Bar stile nativo iOS/Android -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-icon-wrap" aria-hidden="true">
                    <i data-lucide="shopping-cart"></i>
                </div>
                <div class="brand-text">
                    <span class="eyebrow">LISTA CONDIVISA</span>
                    <h1>La nostra spesa</h1>
                </div>
            </div>
            <div class="header-controls">
                <button type="button" id="wake-lock-btn" class="icon-pill-btn" aria-pressed="false" title="Mantieni schermo attivo durante la spesa">
                    <i data-lucide="smartphone" class="btn-lucide"></i>
                    <span class="btn-label">Schermo attivo</span>
                </button>
                <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="Cambia tema chiaro/scuro" title="Cambia tema">
                    <i data-lucide="moon" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <!-- Barra Preferiti / Acquisti Frequenti -->
        <section class="favorites-section" aria-label="Prodotti preferiti">
            <div class="favorites-header">
                <span class="favorites-title">
                    <i data-lucide="star" class="inline-icon"></i>
                    Acquisti frequenti
                </span>
                <button type="button" id="add-favorite-btn" class="text-action-btn" title="Salva il prodotto scritto sotto nei preferiti">
                    <i data-lucide="plus" class="inline-icon"></i>
                    Salva preferito
                </button>
            </div>
            <div id="favorites-bar" class="favorites-bar" role="list"></div>
        </section>

        <!-- Scheda di Inserimento Compatta -->
        <section class="input-card" aria-label="Aggiungi prodotto">
            <div class="input-row-main">
                <div class="input-field-wrap">
                    <input type="text" id="item-input" placeholder="Es. latte, pane, detersivo..." autocomplete="off" enterkeyhint="done">
                </div>
                <div class="quantity-controls" aria-label="Quantità">
                    <button type="button" id="decrease-qty" aria-label="Diminuisci quantità">
                        <i data-lucide="minus"></i>
                    </button>
                    <span id="item-qty" aria-live="polite">1</span>
                    <button type="button" id="increase-qty" aria-label="Aumenta quantità">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
            </div>

            <div class="input-row-secondary">
                <i data-lucide="sticky-note" class="note-leading-icon" aria-hidden="true"></i>
                <input type="text" id="note-input" placeholder="Nota opzionale (es. 500g, bio)" autocomplete="off">
            </div>

            <!-- Pillole selezionabili Reparti -->
            <div id="category-chips" class="category-chips" role="radiogroup" aria-label="Seleziona reparto">
                <button type="button" class="category-chip" data-category="Ortofrutta" aria-pressed="false">
                    <i data-lucide="apple"></i>
                    <span>Ortofrutta</span>
                </button>
                <button type="button" class="category-chip" data-category="Frigo e Latticini" aria-pressed="false">
                    <i data-lucide="snowflake"></i>
                    <span>Frigo</span>
                </button>
                <button type="button" class="category-chip" data-category="Dispensa" aria-pressed="false">
                    <i data-lucide="package"></i>
                    <span>Dispensa</span>
                </button>
                <button type="button" class="category-chip" data-category="Carne e Pesce" aria-pressed="false">
                    <i data-lucide="fish"></i>
                    <span>Carne/Pesce</span>
                </button>
                <button type="button" class="category-chip" data-category="Casa e Pulizia" aria-pressed="false">
                    <i data-lucide="home"></i>
                    <span>Casa</span>
                </button>
                <button type="button" class="category-chip active" data-category="Altro" aria-pressed="true">
                    <i data-lucide="layers"></i>
                    <span>Altro</span>
                </button>
            </div>

            <div class="input-actions">
                <button type="button" id="add-btn">
                    <i data-lucide="plus"></i>
                    <span>Aggiungi</span>
                </button>
                <button type="button" id="delete-all-btn" class="danger-btn" title="Elimina tutto l'archivio">
                    <i data-lucide="trash-2"></i>
                    <span>Elimina tutto</span>
                </button>
            </div>

            <div class="sync-row">
                <span class="sync-dot" id="sync-dot" aria-hidden="true"></span>
                <p id="sync-status" class="sync-status">Connessione in corso...</p>
            </div>
        </section>

        <!-- Lista Da Comprare (raggruppata per reparto) -->
        <div class="section-header">
            <div class="section-title-wrap">
                <h2 class="section-title">DA COMPRARE</h2>
                <span id="pending-count" class="badge">0</span>
            </div>
            <button type="button" id="clear-pending-btn" class="clear-list-btn">
                <i data-lucide="eraser"></i>
                <span>Pulisci</span>
            </button>
        </div>
        <div id="pending-container" class="pending-container"></div>

        <!-- Lista Comprati -->
        <div class="section-header">
            <div class="section-title-wrap">
                <h2 class="section-title">COMPRATI</h2>
                <span id="bought-count" class="badge">0</span>
            </div>
            <button type="button" id="clear-bought-btn" class="clear-list-btn">
                <i data-lucide="eraser"></i>
                <span>Pulisci</span>
            </button>
        </div>
        <ul id="bought-list" class="shopping-list"></ul>
    </main>

    <!-- Banner Installazione PWA -->
    <div id="install-banner" class="install-banner" style="display: none;" role="region" aria-label="Installa applicazione">
        <div class="install-banner-content">
            <img src="icons/icon-192.png" alt="" class="install-banner-icon" width="38" height="38">
            <div class="install-banner-text">
                <strong>Installa La nostra spesa</strong>
                <span id="install-banner-desc"></span>
            </div>
        </div>
        <div class="install-banner-actions">
            <button type="button" id="install-action-btn" class="install-primary-btn" style="display: none;">Installa</button>
            <button type="button" id="install-dismiss-btn" class="install-close-btn" aria-label="Chiudi banner">
                <i data-lucide="x"></i>
            </button>
        </div>
    </div>

    <!-- Pop-up Modale per Avvisi e Conferme -->
    <div id="custom-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-message">
        <div class="modal-content">
            <p id="modal-message"></p>
            <div class="modal-buttons">
                <button type="button" id="modal-cancel" class="modal-btn secondary">Annulla</button>
                <button type="button" id="modal-confirm" class="modal-btn primary">Conferma</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
